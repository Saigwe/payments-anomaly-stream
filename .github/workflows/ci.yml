name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Real card transactions -> stream replay -> day-2 scoring -> pytest
        run: make all
      - name: README charts render from the results
        run: python charts/make_charts.py
